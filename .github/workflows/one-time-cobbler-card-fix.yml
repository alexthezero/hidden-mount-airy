name: One-time cobbler card correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-cobbler-card-fix.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Correct cobbler card wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          replacements = {
              'eyebrow: "Food · Surry County original"': 'eyebrow: "Food · Local dessert"',
              'title: "Taste a sonker, not a cobbler"': 'title: "Taste a local cobbler"',
              '"Deeper and juicier than cobbler, sonker is a heritage dessert strongly associated with Surry County. There is an official trail devoted to it."': '"Warm fruit, a baked crust, and a scoop-worthy finish make cobbler an easy sweet stop while exploring Mount Airy."',
              'source: "https://sonkertrail.org/"': 'source: "https://www.anchoredbakerymtairy.com/"',
              'sourceLabel: "Official Sonker Trail"': 'sourceLabel: "Bakery details"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Build GitHub Pages export
        run: npm run build:github-pages

      - name: Sync exported site
        run: |
          cp -a out/. .
          rm -rf docs
          mkdir -p docs
          cp -a out/. docs/
          touch .nojekyll docs/.nojekyll
          rm -f .github/workflows/one-time-cobbler-card-fix.yml

      - name: Commit and push corrected site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct sonker card to cobbler wording"
          git pull --rebase origin main
          git push origin main
