name: One-time cobbler wording correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-cobbler-fix.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Correct itinerary wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          old = 'title: "Find the sonker"'
          new = 'title: "Find the cobbler"'
          if old not in text:
              raise SystemExit('Expected itinerary wording was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build GitHub Pages export
        run: npm run build:github-pages

      - name: Sync exported site
        run: |
          cp -a out/. .
          rm -rf docs
          mkdir -p docs
          cp -a out/. docs/
          touch .nojekyll docs/.nojekyll
          rm -f .github/workflows/one-time-cobbler-fix.yml

      - name: Commit corrected source and export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct itinerary wording to cobbler"
          git push
